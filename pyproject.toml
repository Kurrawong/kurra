[project.urls]
Homepage = "https://github.com/kurrawong/kurra"
Documentation = "https://docs.kurrawong.ai/tools/kurra"
Source = "https://github.com/kurrawong/kurra"
Changelog = "https://github.com/Kurrawong/kurra/releases"

[project]
name = "kurra"
version = "3.0.6a"
description = "A Python package of RDF data manipulation functions that can be called from the command line or other software"
authors = [
    { name = "Edmond Chuc", email = "edmond@kurrawong.ai" },
    { name = "Nicholas Car", email = "nick@kurrawong.ai" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    "Programming Language :: Python :: 3.14",
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    "License :: OSI Approved :: BSD License",
    'Operating System :: OS Independent',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Internet',
]
dependencies = [
    "httpx>=0.28.1",
    "rdflib>=7.6.0",
    "rich>=13.9.4",
    "typer>=0.15.1",
    "pyshacl>=0.31.0",
    "shacl-rules>=0.1.3",
    "sparqlib>=0.5.0",
]

[dependency-groups]
dev = [
    "mkdocstrings-python",
    "pytest>=8.3.4",
    "ruff>=0.9.0",
    "testcontainers>=4.9.0",
    "zensical>=0.0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kurra = "kurra.cli:app"

[project.optional-dependencies]
dataframe = [
    "pandas>=2.3.3",
]

[tool.uv]
required-version = ">=0.7.9"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
filterwarnings = [
    "error:::kurra(\\..*)?",
    "ignore:ConjunctiveGraph is deprecated, use Dataset instead\\.:DeprecationWarning",
    "ignore:Dataset\\.contexts is deprecated, use Dataset\\.graphs instead\\.:DeprecationWarning",
    "ignore:Dataset\\.default_context is deprecated, use Dataset\\.default_graph instead\\.:DeprecationWarning",
]
